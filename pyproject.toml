[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minispice"
version = "0.1.0"
description = "A minimal SPICE-like circuit simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
web = [
    "flask>=3.0",
]

[tool.setuptools.packages.find]
include = ["minispice*"]

[tool.setuptools.package-data]
"minispice.web" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
